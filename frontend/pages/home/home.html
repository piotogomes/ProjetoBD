
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>ProjetoBD - Home</title>
</head>

<body>

    <h1>Bem-vindo, {{ session["user_name"] }}!</h1>

    <p>
        Perfil: {{ session["perfil"] }}
    </p>

    <nav>

        {% if session["perfil"] == "COORDENADOR" %}

            <a href="/funcionarios">Funcionários</a>
            <a href="/disciplinas">Disciplinas</a>
            <a href="/atividades">Atividades</a>

        {% elif session["perfil"] == "PROFESSOR" %}

            <a href="/disciplinas">Disciplinas</a>

        {% elif session["perfil"] == "RECREADOR" %}

            <a href="/atividades">Atividades</a>

        {% endif %}

    </nav>

    <form action="{{ url_for('auth.logout') }}" method="POST">

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >

        <button type="submit">Sair</button>

    </form>

</body>
</html>
