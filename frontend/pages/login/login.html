
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - ProjetoBD</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='pages/login/login.css') }}">

    <script
        src="{{ url_for('static', filename='pages/login/login.js') }}"
        defer>
    </script>
</head>

<body>

    <main class="login-container">

        <div class="login-card">

            <h1>ProjetoBD</h1>

            <p class="subtitle">
                Entre com suas credenciais
            </p>

            {% with mensagens = get_flashed_messages() %}

                {% if mensagens %}

                    {% for mensagem in mensagens %}

                        <div class="erro">
                            {{ mensagem }}
                        </div>

                    {% endfor %}

                {% endif %}

            {% endwith %}

            <form action="{{ url_for('auth.login') }}"
                  method="POST">

                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >

                <div class="form-group">
                    <label for="cpf">CPF</label>
                
                    <input
                        type="text"
                        id="cpf"
                        name="cpf"
                        placeholder="Digite seu CPF"
                        required
                    >
                </div>

                <div class="form-group">

                    <label for="senha">
                        Senha
                    </label>

                    <div class="password-container">

                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="toggleSenha"
                            class="toggle-senha">
                            Mostrar
                        </button>

                    </div>

                </div>

                <button type="submit" class="btn-login">
                    Entrar
                </button>
                
                <div class="cadastro-link" style="margin-top: 15px; text-align: center;">
                    <p>Não possui conta? <a href="{{ url_for('cadastro.registrar') }}">Cadastre-se</a></p>
                </div>

            </form>

        </div>

    </main>

</body>
</html>
